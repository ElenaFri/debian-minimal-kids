// IMPORTANT : la première ligne d'un fichier AutoConfig est ignorée par Firefox.
//
// kids.cfg — applique le thème intégré « Alpenglow » (dégradé violet/magenta,
// assorti au style magenta de l'OS) au premier démarrage d'un profil.
//
// Pourquoi ce script plutôt qu'une simple préférence : au démarrage normal,
// Firefox n'installe QUE le thème par défaut. Les autres thèmes intégrés
// (dont Alpenglow) ne sont installés que par l'onboarding (désactivé ici) ou en
// ouvrant about:addons. On les installe donc nous-mêmes via BuiltInThemes puis
// on active Alpenglow. Un marqueur (distribution.kids.themeApplied) évite de
// réimposer le thème à chaque démarrage : sur le système installé l'utilisateur
// reste libre de le changer ; en live (profil neuf à chaque boot) il s'applique
// à chaque fois.
try {
  const KIDS_THEME = "firefox-alpenglow@mozilla.org";
  const KIDS_MARKER = "distribution.kids.themeApplied";
  if (!Services.prefs.getBoolPref(KIDS_MARKER, false)) {
    Services.obs.addObserver(function kidsThemeObserver(subject, topic) {
      Services.obs.removeObserver(kidsThemeObserver, topic);
      (async () => {
        try {
          const { AddonManager } = ChromeUtils.importESModule(
            "resource://gre/modules/AddonManager.sys.mjs"
          );
          const { BuiltInThemes } = ChromeUtils.importESModule(
            "resource:///modules/BuiltInThemes.sys.mjs"
          );
          await BuiltInThemes.ensureBuiltInThemes();
          const addon = await AddonManager.getAddonByID(KIDS_THEME);
          if (addon && !addon.isActive) {
            await addon.enable();
          }
          Services.prefs.setBoolPref(KIDS_MARKER, true);
        } catch (e) {
          Cu.reportError(e);
        }
      })();
    }, "sessionstore-windows-restored");
  }
} catch (e) {
  Cu.reportError(e);
}
