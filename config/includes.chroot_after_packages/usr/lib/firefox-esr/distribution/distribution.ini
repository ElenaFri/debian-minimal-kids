# Marque-pages debian-minimal-kids — posés directement sur la barre
# personnelle de Firefox (mécanisme « distribution bookmarks », lu par
# firefox-esr dans <install>/distribution/distribution.ini).
#
# Appliqué une seule fois par profil (pref distribution.<id>.bookmarksProcessed).
# Pour forcer une ré-application après modification d'une entrée, incrémenter
# la version ci-dessous ET changer l'id (ex. kids2) : les profils existants
# la rechasseront alors comme une nouvelle distribution.

[Global]
id=kids2
version=1.1
about=Marque-pages debian-minimal-kids

[BookmarksToolbar]
item.1.title=Vidéos
item.1.type=folder
item.1.folderId=videos
item.2.title=École
item.2.type=folder
item.2.folderId=ecole
item.3.title=Wikipédia
item.3.link=https://fr.wikipedia.org

[BookmarksFolder-videos]
item.1.title=YouTube Kids
item.1.link=https://www.youtubekids.com
item.2.title=Disney+
item.2.link=https://www.disneyplus.com/fr-fr

[BookmarksFolder-ecole]
item.1.title=Khan Academy
item.1.link=https://fr.khanacademy.org
item.2.title=Lumni
item.2.link=https://www.lumni.fr
item.3.title=Scratch
item.3.link=https://scratch.mit.edu
item.4.title=1jour1actu
item.4.link=https://www.1jour1actu.com
