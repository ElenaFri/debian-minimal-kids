# Disposition clavier du serveur X : français AZERTY (variante latin9).
#
# POURQUOI ce fichier EN PLUS de /etc/default/keyboard :
#   - /etc/default/keyboard ne configure QUE la console (via console-setup).
#   - Le serveur X — donc la session XFCE ET l'installateur Calamares — lit sa
#     disposition dans /etc/X11/xorg.conf.d/*.conf, PAS dans /etc/default/keyboard.
#   - Sans ce fichier, X démarrait en qwerty (us) malgré /etc/default/keyboard=fr :
#     le live et l'installateur étaient en qwerty, et Calamares, détectant qwerty
#     depuis la session live, installait un système en qwerty.
#
# Présent dans le squashfs, ce fichier :
#   1. rend la session live (et l'installateur) AZERTY ;
#   2. fait détecter « fr » à Calamares → il écrit « fr » sur la cible ;
#   3. est hérité tel quel par le système installé.
# (localectl écrit exactement ce fichier ; c'est l'emplacement canonique pour X.)
Section "InputClass"
    Identifier "system-keyboard"
    MatchIsKeyboard "on"
    Option "XkbModel" "pc105"
    Option "XkbLayout" "fr"
    Option "XkbVariant" "latin9"
    Option "XkbOptions" ""
EndSection
