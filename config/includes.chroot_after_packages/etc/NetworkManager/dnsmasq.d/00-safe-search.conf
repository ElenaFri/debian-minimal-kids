# SafeSearch + « Mode restreint » YouTube, appliqués par réécriture CNAME.
# Lu par le dnsmasq lancé par NetworkManager (voir conf.d/00-dns-dnsmasq.conf).
#
# Objectif « contacts non sollicités » : le Mode restreint YouTube masque les
# commentaires et le chat en direct (principaux canaux de contact par des
# inconnus), en plus de filtrer les contenus adultes. SafeSearch verrouille les
# résultats des moteurs non bloqués. Noms d'hôtes officiels de Google/Bing/DDG.

# --- YouTube : Mode restreint (modéré) ---------------------------------------
cname=www.youtube.com,restrictmoderate.youtube.com
cname=m.youtube.com,restrictmoderate.youtube.com
cname=youtubei.googleapis.com,restrictmoderate.youtube.com
cname=youtube.googleapis.com,restrictmoderate.youtube.com
cname=www.youtube-nocookie.com,restrictmoderate.youtube.com

# --- SafeSearch forcé (moteurs non supprimés de Firefox) ---------------------
cname=www.google.com,forcesafesearch.google.com
cname=www.bing.com,strict.bing.com
cname=duckduckgo.com,safe.duckduckgo.com
