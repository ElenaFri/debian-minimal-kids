# Active le résolveur DNS local intégré de NetworkManager (dnsmasq-base).
# Toutes les requêtes passent d'abord par dnsmasq (127.0.0.1), qui :
#   - applique SafeSearch et le « Mode restreint » YouTube (dnsmasq.d/00-safe-search.conf),
#   - puis transfère au DNS familial OpenDNS FamilyShield imposé par 99-kids-dns.conf.
# L'enfant ne peut pas contourner ce filtrage (DoH désactivé dans Firefox).
[main]
dns=dnsmasq
