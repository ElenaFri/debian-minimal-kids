# DNS familial OpenDNS FamilyShield pour toutes les connexions.
# Les clés du groupe [connection] servent de valeurs par défaut à toute
# nouvelle connexion NetworkManager (Ethernet, wifi, partagées…).
# L'enfant ne peut pas contourner le filtrage depuis l'applet réseau :
# les DNS sont imposés et les DNS auto (DHCP) ignorés.
[connection]
ipv4.dns=208.67.222.123;208.67.220.123;
ipv4.ignore-auto-dns=true
ipv6.ignore-auto-dns=true
