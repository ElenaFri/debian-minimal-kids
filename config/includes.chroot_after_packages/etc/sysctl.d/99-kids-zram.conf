# debian-minimal-kids — réglages compagnons de zram (swap compressé en RAM).
# Valeurs recommandées avec zram (cf. systemd-zram-generator, Fedora).

# Préférer échanger vers le zram (rapide, compressé) plutôt qu'évincer les
# caches applicatifs. Valeur par défaut du noyau : 60.
vm.swappiness = 100

# Ne pas lire de pages de swap voisines en avance : inutile, le swap zram
# est déjà en RAM. Valeur par défaut du noyau : 3 (8 pages lues d'un coup).
vm.page-cluster = 0
