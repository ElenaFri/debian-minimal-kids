---
# Surcharge locale pour Kiddux (calamares-settings-debian n'en fournit pas).
# Fuseau horaire présélectionné : Europe/Paris, puisque la distribution est
# francophone. L'utilisateur peut toujours le changer sur la page « Localisation ».
# La langue du système installé suit la langue choisie sur la page d'accueil, qui
# par défaut reprend celle du live (français) → aucune config supplémentaire.
region: "Europe"
zone:   "Paris"
