---
# Thème Plymouth du système installé. calamares-settings-debian ne fournit pas
# ce fichier (le module ne fait alors rien, et le thème « kids » du squashfs est
# conservé) ; on le force explicitement par sécurité. Le module « initramfs »,
# exécuté ensuite, régénère l'initramfs pour embarquer le thème.
plymouth_theme: kids
