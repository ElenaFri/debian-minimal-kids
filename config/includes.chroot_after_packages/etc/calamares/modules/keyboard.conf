---
# Surcharge clavier pour Kiddux (calamares-settings-debian n'en fournit pas).
# Disposition présélectionnée : français AZERTY, variante latin9 — identique au
# live et à /etc/default/keyboard. guessLayout: false pour ne pas laisser Calamares
# redeviner la disposition à partir de la langue. L'utilisateur peut la changer
# sur la page « Clavier » si besoin.
xOrgConfFileName:    "00-keyboard.conf"
convertedKeymapPath: "/lib/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: true
guessLayout:         false
keyboardModel:       "pc105"
keyboardLayout:      "fr"
keyboardVariant:     "latin9"
