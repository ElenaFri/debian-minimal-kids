backend: apt

# Surcharge de la config fournie par calamares-settings-debian : on ajoute
# « calamares » à la liste des paquets retirés du système installé (la config
# d'origine ne purge que calamares-settings-debian). Le système installé n'a
# plus besoin de l'installateur ni de ses dépendances Qt/KPMcore.
operations:
  - remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'
      - 'calamares'
      - 'calamares-settings-debian'
