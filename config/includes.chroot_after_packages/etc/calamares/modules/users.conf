# SPDX-License-Identifier: CC0-1.0
#
# Surcharge Kiddux du module « users » de Calamares (remplace le users.conf de
# calamares-settings-debian, qui crée un utilisateur administrateur).
#
# But : sur le système INSTALLÉ, le compte de l'enfant est NON-administrateur
# (hors du groupe « sudo »), et l'administration passe par un mot de passe root
# DISTINCT, choisi par le parent pendant l'installation. L'enfant ne peut donc
# ni désactiver le couvre-feu ni défaire les protections parentales.
#
# N.B. : ceci n'affecte QUE le système installé. Le live reste inchangé (son
# utilisateur « lisa » est créé par live-config et garde les droits requis pour
# lancer l'installateur).
---
# Groupes secondaires du compte enfant : accès au matériel courant, mais PAS
# « sudo ». Chaque nom absent de la cible serait créé par Calamares.
defaultGroups:
    - cdrom
    - floppy
    - audio
    - dip
    - video
    - plugdev
    - netdev

# Pas de clé « sudoersGroup » : Debian configure déjà le groupe « sudo » dans
# son paquet ; comme on n'y ajoute personne, aucun compte interactif n'a sudo —
# seul root (avec mot de passe) administre.

autologinGroup: autologin

# Compte root ACTIVÉ avec mot de passe = compte d'administration du parent.
# doReusePassword décoché par défaut → mot de passe root DISTINCT de celui de
# l'enfant (sinon l'enfant connaîtrait le mot de passe admin).
setRootPassword: true
doReusePassword: false

# Connexion automatique de l'enfant (machine mono-utilisateur), décochable.
displayAutologin: true
doAutologin: true

# Public familial : pas d'exigence de robustesse bloquante à l'installation.
passwordRequirements:
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
allowWeakPasswords: true
allowWeakPasswordsDefault: true

user:
    shell: /bin/bash
    forbidden_names: [ root ]

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${first}-pc"
    forbidden_names: [ localhost ]
