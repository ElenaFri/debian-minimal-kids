---
# Surcharge du welcome.conf de calamares-settings-debian.
# requiredStorage abaissé de 15 à 6 Gio : le système Kiddux installé ne pèse que
# ~3,2 Gio de fichiers ; 6 Gio laissent la place pour le swap, les métadonnées
# ext4 et un peu d'espace libre. En dessous, l'installation risque d'échouer
# (disque plein) si un swap de la taille de la RAM est créé.
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true

requirements:
    requiredStorage:    6
    requiredRam:        1.0
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root
