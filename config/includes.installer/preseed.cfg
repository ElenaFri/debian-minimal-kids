# -----------------------------------------------------------------------------
# Préconfiguration de l'installateur Debian (d-i) — français par défaut
# -----------------------------------------------------------------------------
# Objectif : proposer le français par défaut lors de l'installation sur disque.
# (L'utilisateur peut toujours modifier ces choix pendant l'installation.)
#
# Remarque : les toutes premières questions de l'installateur (langue, clavier)
# sont posées AVANT la lecture de ce fichier. Elles sont donc également forcées
# via les paramètres de démarrage « locale » et « keymap » définis dans
# auto/config (option --bootappend-install).

# Langue et locale
d-i debian-installer/locale string fr_FR.UTF-8

# Clavier (AZERTY)
d-i keyboard-configuration/xkb-keymap select fr(latin9)

# Fuseau horaire
d-i time/zone string Europe/Paris
d-i clock-setup/utc boolean true

# Finalisation du système installé :
#  - délai du menu GRUB 5 s (défaut Debian) -> 1 s (un appui long sur
#    Échap/Shift au démarrage le fait réapparaître) ;
#  - « quiet splash » dans GRUB_CMDLINE_LINUX_DEFAULT : l'installateur écrit un
#    /etc/default/grub sans « splash », sinon le splash Plymouth « kids » ne
#    s'affiche pas sur le système installé (on voit le démarrage par défaut) ;
#  - réaffirmation du thème Plymouth « kids » + régénération de l'initramfs,
#    au cas où l'installateur aurait reconstruit l'initramfs sans lui ;
#  - LANG=fr_FR.UTF-8 : ceinture et bretelles (la locale est déjà figée dans le
#    squashfs par le hook 1020), pour garantir un système installé en français ;
#  - purge du lanceur d'installateur et de son icône de bureau : ils n'ont
#    de sens que sur le live, pas sur un système déjà installé.
d-i preseed/late_command string in-target sh -c 'sed -i "s/^GRUB_TIMEOUT=.*/GRUB_TIMEOUT=1/" /etc/default/grub; if grep -q "^GRUB_CMDLINE_LINUX_DEFAULT=" /etc/default/grub; then sed -i "s/^GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT=\"quiet splash\"/" /etc/default/grub; else echo "GRUB_CMDLINE_LINUX_DEFAULT=\"quiet splash\"" >> /etc/default/grub; fi; plymouth-set-default-theme kids || true; update-grub; update-initramfs -u || true; echo "LANG=fr_FR.UTF-8" > /etc/default/locale; apt-get -y purge debian-installer-launcher || true; rm -f /etc/skel/Desktop/debian-installer-launcher.desktop /root/Desktop/debian-installer-launcher.desktop /home/*/Desktop/debian-installer-launcher.desktop /etc/skel/.config/autostart/kids-trust-launcher.desktop /root/.config/autostart/kids-trust-launcher.desktop /home/*/.config/autostart/kids-trust-launcher.desktop'
